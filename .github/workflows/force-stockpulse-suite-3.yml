name: StockPulse implementation runner
on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'backend/**'
      - 'scripts/apply-suite.trigger'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify StockPulse modules
        run: |
          test -f backend/app/feature_routes.py
          test -f backend/app/broker_routes.py
          test -f web/stockpulse-suite.js
          test -f web/broker-calls.js
          grep -q 'stockpulse-suite.js' web/index.html
          grep -q 'broker-calls.js' web/index.html
          grep -q 'register_feature_routes' backend/app/main.py
          grep -q 'register_broker_routes' backend/app/main.py
          python -m py_compile backend/app/main.py backend/app/feature_routes.py backend/app/broker_routes.py
          echo 'StockPulse intelligence modules verified.'
